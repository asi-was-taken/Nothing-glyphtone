    .dot-matrix {
      background-color: #272b33;
      background-image: radial-gradient(#3c424d 1.2px, transparent 1.2px);
      background-size: 6px 6px;
    }
  </style>
</head>

          <svg class="w-3 h-3 text-red-500" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

            <div class="absolute -right-[2px] top-[85px] w-[2px] h-[28px] bg-[#4f5563] rounded-r"></div>

            <!-- UPPER MODULE (135px tall) -->
            <div class="h-[135px] w-full dot-matrix relative border-b border-[#1c1f26] overflow-hidden">

              </div>
              <div class="absolute bottom-1.5 left-1.5 w-2 h-2 rounded-full bg-[#1e2126] border border-[#505763] flex items-center justify-center z-30">

            <span>EXPORT 60 FPS CSV</span>
          </button>
          <button id="btnExportAudio" class="bg-[#272b35] hover:bg-[#323744] text-gray-200 border border-[#3b4150] font-mono text-[11px] py-1.5 px-2 rounded-lg transition flex items-center justify-center gap-1 cursor-pointer">
            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>

  <!-- Native HTML5 Universal Audio Element (Guaranteed Zero-Block Playback on All Devices) -->
  <audio id="nativeAudioPlayer" preload="auto"></audio>

  <script>
    // State
    const player = document.getElementById('nativeAudioPlayer');
    let isPlaying = false;
    let animFrameId = null;
    let routingMode = 'drums';
    let bassSens = 1.4;
    let onsetThreshold = 0.35;
    let currentFileName = "Nothing 3a Demo Synth.wav";
    let precomputedFrames = [];
    let songDuration = 6.0;
    let rawAudioSamples = null;
    let sampleRate = 44100;

    // Elements
    const glyphTL = document.getElementById('glyph-tl');
    const glyphBL = document.getElementById('glyph-bl');
    const glyphR = document.getElementById('glyph-r');
    const valTL = document.getElementById('val-tl');
    const valBL = document.getElementById('val-bl');
    const valR = document.getElementById('val-r');
    const playbackTime = document.getElementById('playbackTime');
    const playheadBar = document.getElementById('playheadBar');
    const fpsCounter = document.getElementById('fpsCounter');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const waveformContainer = document.getElementById('waveformContainer');
    const engineBadge = document.getElementById('engineBadge');
    const playBtnText = document.getElementById('playBtnText');

    // 1. Generate 100% Genuine Standards-Compliant 16-bit PCM WAV in memory
    function generateDemoWavBlob() {
      const sr = 44100;
      const dur = 6.0;
      songDuration = dur;
      sampleRate = sr;
      const totalSamples = Math.floor(sr * dur);
      const buffer = new ArrayBuffer(44 + totalSamples * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + totalSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, totalSamples * 2, true);

      rawAudioSamples = new Float32Array(totalSamples);
      const bpm = 126;
      const beat = 60 / bpm;
      let offset = 44;

      for (let i = 0; i < totalSamples; i++) {
        const t = i / sr;
        const beatIdx = Math.floor(t / beat);
        const beatTime = t % beat;
        let s = 0;

        // 808 Kick
        if (beatTime < 0.22) {
          const kickFreq = 145.0 * Math.exp(-beatTime * 18.0) + 32.0;
          const kickEnv = Math.max(0, 1.0 - beatTime / 0.22);
          s += 0.75 * Math.sin(2.0 * Math.PI * kickFreq * beatTime) * kickEnv;
        }

        // Snare / Clap on beats 2 & 4
        if (beatIdx % 2 === 1 && beatTime < 0.12) {
          const noise = Math.random() * 2 - 1;
          s += 0.35 * noise * Math.max(0, 1.0 - beatTime / 0.12);
        }

        // Electro Synth Arp
        const notes = [440, 554.37, 659.25, 880, 659.25, 554.37];
        const freq = notes[beatIdx % notes.length];
        const noteTime = beatTime % (beat / 2.0);
        const synthEnv = Math.max(0, 1.0 - (noteTime / (beat / 2.0)));
        const synthWave = (2.0 * ((noteTime * freq) % 1.0) - 1.0);
        s += 0.28 * synthWave * synthEnv;

        const clamped = Math.max(-1, Math.min(1, s));
        rawAudioSamples[i] = clamped;
        view.setInt16(offset, clamped < 0 ? clamped * 0x8000 : clamped * 0x7FFF, true);
        offset += 2;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    // 2. Precompute 60 FPS Glyph Brightness Matrix
    function computeFramesFromSamples() {
      if (!rawAudioSamples) return;
      const totalLen = rawAudioSamples.length;
      const fps = 60.0;
      const totalFrames = Math.floor(songDuration * fps);
      const samplesPerFrame = Math.max(1, Math.floor(sampleRate / fps));

      precomputedFrames = [];
      let bassEnv = 0, midEnv = 0, highEnv = 0;

      for (let f = 0; f < totalFrames; f++) {
        const start = f * samplesPerFrame;
        const end = Math.min(totalLen, start + samplesPerFrame);

        let sumBass = 0, sumMid = 0, sumHigh = 0;
        for (let i = start; i < end; i++) {
          const s = rawAudioSamples[i];
          sumBass += Math.abs(s);
          sumMid += (i > 2) ? Math.abs(s - rawAudioSamples[i - 2]) : 0;
          sumHigh += (i > 0) ? Math.abs(s - rawAudioSamples[i - 1]) : 0;
        }

        const count = Math.max(1, end - start);
        const avgBass = (sumBass / count) * bassSens;
        const avgMid = (sumMid / count) * 1.5;
        const avgHigh = (sumHigh / count) * 2.0;

        bassEnv = (avgBass > bassEnv) ? (bassEnv * 0.2 + avgBass * 0.8) : (bassEnv * 0.88);
        midEnv = (avgMid > midEnv) ? (midEnv * 0.2 + avgMid * 0.8) : (midEnv * 0.88);
        highEnv = (avgHigh > highEnv) ? (highEnv * 0.2 + avgHigh * 0.8) : (highEnv * 0.88);

        let zTL = 0, zBL = 0, zR = 0;

        if (routingMode === 'drums') {
          zR = Math.round(Math.min(4095, (bassEnv > onsetThreshold ? (bassEnv * 4095 * 1.8) : (bassEnv * 2000))));
          zTL = Math.round(Math.min(4095, (midEnv > onsetThreshold ? (midEnv * 4095 * 2.0) : (midEnv * 1200))));
          zBL = Math.round(Math.min(4095, highEnv * 4095 * 2.2));
        } else if (routingMode === 'orbit') {
          const cycle = ((f / fps) % 1.2) / 1.2;
          const boost = Math.min(1.5, (bassEnv + midEnv) * 2);
          if (cycle < 0.33) zTL = Math.round(Math.min(4095, 4095 * boost * (1 - cycle / 0.33)));
          else if (cycle < 0.66) zR = Math.round(Math.min(4095, 4095 * boost * (1 - (cycle - 0.33) / 0.33)));
          else zBL = Math.round(Math.min(4095, 4095 * boost * (1 - (cycle - 0.66) / 0.34)));
        } else if (routingMode === 'strobe') {
          const val = (bassEnv > (onsetThreshold * 1.2)) ? 4095 : Math.round(bassEnv * 1100);
          zTL = val; zBL = val; zR = val;
        } else {
          const val = Math.round(Math.min(1, bassEnv * 0.5 + midEnv * 0.3 + highEnv * 0.2) * 4095);
          zTL = val; zBL = val; zR = val;
        }

        precomputedFrames.push([zTL, zBL, zR]);
      }

      document.getElementById('trackDurationInfo').textContent = `Duration: ${songDuration.toFixed(2)}s • ${precomputedFrames.length} Frames`;
    }

    // 3. Draw Waveform Canvas
    function drawWaveform() {
      if (!rawAudioSamples) return;
      const canvas = waveformCanvas;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = rect.width > 0 ? rect.width : 300;
      const h = rect.height > 0 ? rect.height : 44;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);

      const mid = h / 2;
      ctx.fillStyle = '#08090d';
      ctx.fillRect(0, 0, w, h);

      const step = Math.ceil(rawAudioSamples.length / w);
      ctx.beginPath();
      ctx.strokeStyle = '#4b5563';
      ctx.lineWidth = 1.2;

      for (let i = 0; i < w; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = rawAudioSamples[i * step + j] || 0;
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.moveTo(i, mid + min * (h / 2) * 0.9);
        ctx.lineTo(i, mid + max * (h / 2) * 0.9);
      }
      ctx.stroke();

      // Draw Beat Onset Ticks
      if (precomputedFrames.length > 0) {
        ctx.fillStyle = '#ef4444';
        const framesPerPixel = precomputedFrames.length / w;
        for (let i = 0; i < w; i++) {
          const fIdx = Math.floor(i * framesPerPixel);
          if (precomputedFrames[fIdx] && precomputedFrames[fIdx][2] > 3200) {
            ctx.fillRect(i, h - 3, 1.5, 3);
          }
        }
      }
    }

    // 4. Playback Loop with Hardware Timing
    let lastTick = performance.now();
    function tick(now) {
      if (!isPlaying) return;

      const curTime = player.currentTime % songDuration;
      updatePlayhead(curTime);

      const dt = (now - lastTick) / 1000;
      lastTick = now;
      if (dt > 0) fpsCounter.textContent = `${Math.min(60, (1 / dt)).toFixed(1)} FPS`;

      const frameIdx = Math.floor(curTime * 60);
      if (frameIdx >= 0 && frameIdx < precomputedFrames.length) {
        const [tl, bl, r] = precomputedFrames[frameIdx];
        applyLightValues(tl, bl, r);
      }

      animFrameId = requestAnimationFrame(tick);
    }

    function startPlayback() {
      if (!player.src) {
        initDefaultDemo();
      }

      player.play().then(() => {
        isPlaying = true;
        playBtnText.textContent = "PLAYING...";
        engineBadge.textContent = "ACTIVE";
        engineBadge.className = "text-[11px] px-2 py-0.5 rounded border border-green-700 bg-green-950 text-green-300 font-mono font-bold animate-pulse";
        lastTick = performance.now();
        animFrameId = requestAnimationFrame(tick);
      }).catch(err => {
        console.warn("Audio play interrupted:", err);
      });
    }

    function stopAllAudio() {
      isPlaying = false;
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      player.pause();
      player.currentTime = 0;
      playBtnText.textContent = "PLAY & SYNC GLYPHS";
      engineBadge.textContent = "STOPPED";
      engineBadge.className = "text-[11px] px-2 py-0.5 rounded border border-neutral-700 bg-neutral-900 text-neutral-400 font-mono";
      applyLightValues(0, 0, 0);
      updatePlayhead(0);
    }

    player.onended = () => {
      if (isPlaying) {
        player.currentTime = 0;
        player.play().catch(() => {});
      }
    };

    function updatePlayhead(timeSec) {
      const pct = Math.min(100, (timeSec / songDuration) * 100);
      playheadBar.style.left = `${pct}%`;
      const s = Math.floor(timeSec);
      const ms = Math.floor((timeSec % 1) * 1000);
      playbackTime.textContent = `00:${s.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
    }

    function applyLightValues(tl, bl, r) {
      valTL.textContent = tl;
      valBL.textContent = bl;
      valR.textContent = r;

      function renderStrip(el, val) {
        if (val > 100) {
          el.classList.remove('diffuser-idle');
          el.classList.add('diffuser-active');
          el.style.stroke = '#ffffff';
          el.style.opacity = Math.min(1, 0.4 + val / 2500);
          el.style.filter = `drop-shadow(0 0 ${Math.round(val / 250)}px #ffffff) drop-shadow(0 0 ${Math.round(val / 120)}px rgba(255, 255, 255, 0.95))`;
        } else {
          el.classList.add('diffuser-idle');
          el.classList.remove('diffuser-active');
          el.style.stroke = '#7e8796';
          el.style.opacity = '0.85';
          el.style.filter = 'drop-shadow(0 1px 1px rgba(0,0,0,0.7))';
        }
      }

      renderStrip(glyphTL, tl);
      renderStrip(glyphBL, bl);
      renderStrip(glyphR, r);
    }

    // 5. File Input Handling (Native HTML5 media loader)
    document.getElementById('audioFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('audioTrackStatus').textContent = "LOADING AUDIO...";
      stopAllAudio();
      currentFileName = file.name;
      document.getElementById('currentTrackName').textContent = file.name;

      // Set native media source directly
      const fileUrl = URL.createObjectURL(file);
      player.src = fileUrl;

      // Extract Audio Buffer for Glyph Analysis
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioContextClass();
        const arrayBuf = await file.arrayBuffer();
        const decoded = await actx.decodeAudioData(arrayBuf);
        rawAudioSamples = decoded.getChannelData(0);
        sampleRate = decoded.sampleRate;
        songDuration = decoded.duration;

        document.getElementById('audioTrackStatus').textContent = "BEATS SYNCED";
        computeFramesFromSamples();
        drawWaveform();
        startPlayback();
      } catch (err) {
        // Fallback: Player still works natively! Build synthetic envelope
        document.getElementById('audioTrackStatus').textContent = "NATIVE PLAYER";
        player.onloadedmetadata = () => {
          songDuration = player.duration || 60;
          sampleRate = 44100;
          const fakeLen = Math.floor(songDuration * 44100);
          rawAudioSamples = new Float32Array(fakeLen);
          for (let i = 0; i < fakeLen; i++) rawAudioSamples[i] = (Math.sin(i / 200) * 0.5) + (Math.random() * 0.2);
          computeFramesFromSamples();
          drawWaveform();
          startPlayback();
        };
      }
    });

    // Waveform click to seek
    waveformContainer.addEventListener('click', (e) => {
      const rect = waveformContainer.getBoundingClientRect();
      const clickPct = (e.clientX - rect.left) / rect.width;
      const targetTime = clickPct * songDuration;
      player.currentTime = targetTime;
      updatePlayhead(targetTime);
      const fIdx = Math.floor(targetTime * 60);
      if (precomputedFrames[fIdx]) {
        applyLightValues(...precomputedFrames[fIdx]);
      }
    });

    // Play / Stop Controls
    document.getElementById('btnPlay').addEventListener('click', () => {
      if (isPlaying) stopAllAudio();
      else startPlayback();
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      stopAllAudio();
    });

    // Sliders
    document.getElementById('sliderBass').addEventListener('input', (e) => {
      bassSens = parseFloat(e.target.value);
      document.getElementById('valBassSens').textContent = `${bassSens.toFixed(1)}x`;
      computeFramesFromSamples();
      drawWaveform();
    });

    document.getElementById('sliderThreshold').addEventListener('input', (e) => {
      onsetThreshold = parseFloat(e.target.value);
      document.getElementById('valThreshold').textContent = onsetThreshold < 0.25 ? "Sensitive" : (onsetThreshold > 0.5 ? "Strict" : "Normal");
      computeFramesFromSamples();
      drawWaveform();
    });

    // Presets
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.remove('border-white', 'text-white', 'bg-[#272b35]');
          b.classList.add('border-[#272b35]', 'text-gray-400', 'bg-[#0d0f14]');
        });
        btn.classList.add('border-white', 'text-white', 'bg-[#272b35]');
        routingMode = btn.dataset.mode;
        computeFramesFromSamples();
        drawWaveform();
      });
    });

    // CSV Exporter
    document.getElementById('btnExportCSV').addEventListener('click', () => {
      let csv = "Frame,TopLeft,BottomLeft,Right\n";
      precomputedFrames.forEach((frame, idx) => {
        csv += `${idx},${frame[0]},${frame[1]},${frame[2]}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nothing_3a_${currentFileName.replace(/\.[^/.]+$/, "")}_lightshow.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // WAV Exporter
    document.getElementById('btnExportAudio').addEventListener('click', () => {
      if (!rawAudioSamples) return;
      const sr = sampleRate;
      const samples = rawAudioSamples.length;
      const buffer = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + samples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, samples * 2, true);

      let offset = 44;
      for (let i = 0; i < samples; i++) {
        const s = Math.max(-1, Math.min(1, rawAudioSamples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }

      const wavBlob = new Blob([buffer], { type: 'audio/wav' });
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentFileName.replace(/\.[^/.]+$/, "")}_ringtone.wav`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 1-Click Android Project ZIP Builder
    function makeCrcTable() {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
        table[n] = c;
      }
      return table;
    }
    const CRC_TABLE = makeCrcTable();
    function calcCrc32(bytes) {
      let crc = 0 ^ (-1);
      for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
      return (crc ^ (-1)) >>> 0;
    }

    function buildZipBlob(files) {
      const encoder = new TextEncoder();
      const processed = files.map(f => {
        const nameBytes = encoder.encode(f.name);
        const dataBytes = typeof f.data === 'string' ? encoder.encode(f.data) : f.data;
        return { nameBytes, dataBytes, crc: calcCrc32(dataBytes), size: dataBytes.length };
      });

      const parts = [];
      const cdHeaders = [];
      let currentOffset = 0;

      for (const f of processed) {
        const local = new Uint8Array(30 + f.nameBytes.length);
        const view = new DataView(local.buffer);
        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 0x0800, true);
        view.setUint16(8, 0, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0x5421, true);
        view.setUint32(14, f.crc, true);
        view.setUint32(18, f.size, true);
        view.setUint32(22, f.size, true);
        view.setUint16(26, f.nameBytes.length, true);
        local.set(f.nameBytes, 30);
        parts.push(local);
        parts.push(f.dataBytes);

        const cd = new Uint8Array(46 + f.nameBytes.length);
        const cdView = new DataView(cd.buffer);
        cdView.setUint32(0, 0x02014b50, true);
        cdView.setUint16(4, 20, true);
        cdView.setUint16(6, 20, true);
        cdView.setUint16(8, 0x0800, true);
        cdView.setUint16(10, 0, true);
        cdView.setUint16(12, 0, true);
        cdView.setUint16(14, 0x5421, true);
        cdView.setUint32(16, f.crc, true);
        cdView.setUint32(20, f.size, true);
        cdView.setUint32(24, f.size, true);
        cdView.setUint16(28, f.nameBytes.length, true);
        cdView.setUint32(42, currentOffset, true);
        cd.set(f.nameBytes, 46);
        cdHeaders.push(cd);

        currentOffset += local.length + f.dataBytes.length;
      }

      const cdOffset = currentOffset;
      let cdSize = 0;
      for (const cd of cdHeaders) {
        parts.push(cd);
        cdSize += cd.length;
      }

      const eocd = new Uint8Array(22);
      const eocdView = new DataView(eocd.buffer);
      eocdView.setUint32(0, 0x06054b50, true);
      eocdView.setUint16(8, processed.length, true);
      eocdView.setUint16(10, processed.length, true);
      eocdView.setUint32(12, cdSize, true);
      eocdView.setUint32(16, cdOffset, true);
      parts.push(eocd);

      return new Blob(parts, { type: 'application/zip' });
    }

    function downloadProjectZip() {
      const btn = document.getElementById('btnZipExport');
      const orig = btn.innerHTML;
      btn.innerHTML = `<span>BUILDING ZIP...</span>`;

      try {
        const fullSelfHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const files = [
          {
            name: '.github/workflows/build-apk.yml',
            data: `name: Build Android APK\non:\n  push:\n    branches: [ main, master ]\n  workflow_dispatch:\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - uses: actions/checkout@v4\n    - uses: actions/setup-java@v4\n      with:\n        java-version: '17'\n        distribution: 'temurin'\n    - uses: gradle/actions/setup-gradle@v3\n    - run: gradle wrapper && ./gradlew assembleDebug --stacktrace\n    - uses: actions/upload-artifact@v4\n      with:\n        name: Glyphtone3a-Debug-APK\n        path: app/build/outputs/apk/debug/app-debug.apk\n`
          },
          {
            name: 'settings.gradle.kts',
            data: `pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "Glyphtone3a"\ninclude(":app")\n`
          },
          {
            name: 'build.gradle.kts',
            data: `plugins { id("com.android.application") version "8.3.1" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }\n`
          },
          {
            name: 'app/build.gradle.kts',
            data: `plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid { namespace = "com.nothing.glyphtone"; compileSdk = 34; defaultConfig { applicationId = "com.nothing.glyphtone"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0.0" }\ncompileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\nkotlinOptions { jvmTarget = "17" } }\ndependencies { implementation("androidx.core:core-ktx:1.13.1"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("androidx.webkit:webkit:1.10.0") }\n`
          },
          {
            name: 'app/src/main/AndroidManifest.xml',
            data: `<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nothing.glyphtone">\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<application android:allowBackup="true" android:label="Glyphtone 3a" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">\n<activity android:name=".MainActivity" android:exported="true">\n<intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>\n</activity>\n</application>\n</manifest>\n`
          },
          {
            name: 'app/src/main/java/com/nothing/glyphtone/MainActivity.kt',
            data: `package com.nothing.glyphtone\nimport android.os.Bundle\nimport android.webkit.*\nimport androidx.appcompat.app.AppCompatActivity\nclass MainActivity : AppCompatActivity() {\n  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n    val webView = WebView(this)\n    setContentView(webView)\n    webView.settings.javaScriptEnabled = true\n    webView.settings.domStorageEnabled = true\n    webView.settings.mediaPlaybackRequiresUserGesture = false\n    webView.loadUrl("file:///android_asset/index.html")\n  }\n}\n`
          },
          {
            name: 'app/src/main/assets/index.html',
            data: fullSelfHtml
          }
        ];

        const zipBlob = buildZipBlob(files);
        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'nothing_phone_3a_android_project.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 5000);
      } catch (err) {
        alert("ZIP export error: " + err.message);
      } finally {
        btn.innerHTML = orig;
      }
    }

    // Startup Initializer
    function initDefaultDemo() {
      const demoBlob = generateDemoWavBlob();
      player.src = URL.createObjectURL(demoBlob);
      computeFramesFromSamples();
      drawWaveform();
    }

    // Run initialization immediately
    initDefaultDemo();
    window.addEventListener('resize', drawWaveform);
    setTimeout(drawWaveform, 100);
    setTimeout(drawWaveform, 400);
  </script>
